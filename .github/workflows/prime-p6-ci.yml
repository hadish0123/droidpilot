name: PRIME P6 CI

on:
  push:
    branches:
      - master
      - rebuild/prime-p6
      - fix/prime-chat-ui-auth
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and verify PRIME P6 APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug assembleRelease lintRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/PRIME-P6-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/PRIME-P6-installable.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/PRIME-P6-release-unsigned.apk
          sha256sum /tmp/PRIME-P6-installable.apk > /tmp/PRIME-P6-installable.sha256

      - name: Upload PRIME P6 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-P6-APK
          path: |
            /tmp/PRIME-P6-debug.apk
            /tmp/PRIME-P6-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable PRIME P6 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-P6-INSTALLABLE
          path: |
            /tmp/PRIME-P6-installable.apk
            /tmp/PRIME-P6-installable.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-quality-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.html

  android-device:
    name: Android device tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run PRIME Android instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: ./android
          disable-animations: true
          script: |
            set -eu
            chmod +x ./gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest assembleDebug

            mkdir -p ../device-smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.mobilemcp.pro
            adb shell am start -W -n com.mobilemcp.pro/.MainActivity | tee ../device-smoke/am-start.txt
            grep -q "Status: ok" ../device-smoke/am-start.txt

            sleep 4
            test -n "$(adb shell pidof com.mobilemcp.pro | tr -d '\r')"
            adb shell dumpsys activity activities > ../device-smoke/activity.txt
            grep -q "com.mobilemcp.pro/.MainActivity" ../device-smoke/activity.txt

            adb exec-out screencap -p > ../device-smoke/launch.png
            adb shell uiautomator dump /sdcard/prime-window.xml
            adb pull /sdcard/prime-window.xml ../device-smoke/window.xml
            adb logcat -d -t 800 > ../device-smoke/logcat.txt

            if grep -E "FATAL EXCEPTION|Process: com\.mobilemcp\.pro" ../device-smoke/logcat.txt; then
              echo "PRIME crashed during launch smoke test"
              exit 1
            fi

      - name: Upload install/launch smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-install-launch-smoke
          path: device-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-device-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  mcp:
    name: MCP bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Compile PRIME P6 MCP bridge
        working-directory: mcp-server
        run: npm test

  persian-voice:
    name: Persian native synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned speech runtime
        run: python -m pip install sherpa-onnx==1.13.8
      - name: Verify voice pack and generate Persian audio
        run: python scripts/verify_persian_voice.py
